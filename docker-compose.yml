# One-command self-host (VPS, home server, or any Docker host):
#   cp .env.example .env   # edit credentials
#   docker compose up -d --build
services:
  spike-agent:
    build: .
    container_name: spike-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - spike-data:/data
    restart: unless-stopped   # survives crashes and host reboots
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  spike-data:
